name: workpods-learning-pi

services:
  pi-runner:
    image: workpods/pi-runner:local
    build:
      context: ${WORKPODS_INGEST_DIR:-../../workpods-ingest}
      dockerfile: pi/Dockerfile.pi
      args:
        WORKPODS_BUILD_REVISION: local-learning
    container_name: learning-pi-runner
    env_file:
      - ../runtime/pi/secrets/pi-runner.env
    environment:
      PI_CONFIG_PATH: /opt/pi/config/profiles.yaml
      PI_MCP_CONFIG_PATH: /opt/pi/config/mcp.yaml
      PI_WORKSPACE_ROOT: /opt/pi/state/runs
      PI_RUNNER_PORT: "8080"
      HOME: /opt/pi/home
      CODEX_HOME: /opt/pi/home/.codex
    volumes:
      - ../runtime/pi/state:/opt/pi/state
      - ../runtime/pi/home/.codex:/opt/pi/home/.codex:ro
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()\nPY"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - workpods-learning

  pi-bridge:
    image: python:3.12-slim
    container_name: learning-pi-bridge
    depends_on:
      pi-runner:
        condition: service_healthy
    env_file:
      - ../runtime/pi/secrets/pi-bridge.env
    volumes:
      - ../bridges/pi/bridge:/bridge:ro
      - ../runtime/pi/state:/state
      - ${WORKPODS_BUZZ_DIR:-../../workpods-buzz}/hermes/buzz-bin:/buzz-bin:ro
    command: ["python", "/bridge/pi_buzz_bridge.py"]
    restart: unless-stopped
    networks:
      workpods-learning:
        aliases:
          - pi-learning

networks:
  workpods-learning:
    external: true
    name: workpods-learning
